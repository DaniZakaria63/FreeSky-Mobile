name: Build Dev

on:
  push:
    branches: [dev]
    tags: ["v0.*"]

jobs:
  dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "APP_VERSION_NAME=$VERSION" >> $GITHUB_ENV
          else
            echo "APP_VERSION_NAME=0.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug \
            -PappVersionCode=${{ github.run_number }} \
            -PappVersionName=$APP_VERSION_NAME

      - name: Create GitHub Release (tagged only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Dev ${{ env.APP_VERSION_NAME }}
          body: |
            ## Dev Release ${{ env.APP_VERSION_NAME }}

            **Commit:** ${{ github.sha }}

            ### Assets
            - APK: app-debug.apk
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true